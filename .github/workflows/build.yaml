---
name: Build
on:
  workflow_dispatch:
    inputs:
      libdigidoc_ref:
        required: true
        default: v4.4.0
      digidoc_ref:
        required: true
        default: v4.10.0
jobs:
  build:
    strategy:
      matrix:
        release: [sid]
        arch: [amd64, arm64]
    name: ${{matrix.release}} ${{matrix.arch}}
    runs-on: ubuntu-24.04${{matrix.arch == 'arm64' && '-arm' || ''}}
    container: debian:${{matrix.release}}
    env:
      DEBEMAIL: github-actions@github.com
      DEBFULLNAME: github-actions
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get -qq update
          apt-get -y install --no-install-recommends \
            build-essential \
            cmake \
            debhelper \
            default-jdk-headless \
            devscripts \
            doxygen \
            gettext \
            git \
            libboost-test-dev \
            libflatbuffers-dev \
            libgl-dev \
            libldap2-dev \
            libminizip-dev \
            libpcsclite-dev \
            libpython3-dev \
            libqt6svg6-dev \
            libssl-dev \
            libxml2-dev \
            libxmlsec1-dev \
            lintian \
            lsb-release \
            pkg-config \
            python3-setuptools \
            qt6-l10n-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            swig \
            zlib1g-dev
      - name: Checkout libdigidoc
        uses: actions/checkout@v4
        with:
          repository: open-eid/libdigidocpp
          ref: ${{github.event.inputs.libdigidoc_ref}}
          path: libdigidoc
      - name: Build libdigidoc
        working-directory: libdigidoc
        run: |
          export VERSION=$(grep project CMakeLists.txt | egrep -o "([0-9]{1,}\.)+[0-9]{1,}")
          export VERSIONEX=${VERSION}+${{matrix.release}}.${{github.run_number}}
          dch --distribution ${{matrix.release}} -v ${VERSIONEX} "Release ${VERSIONEX}."
          JAVA_HOME=/usr/lib/jvm/default-java dpkg-buildpackage -us -uc
      - name: Install libdigidoc
        run: |
          dpkg -i *.deb
      - name: Checkout digidoc
        uses: actions/checkout@v4
        with:
          repository: open-eid/DigiDoc4-Client
          submodules: recursive
          ref: ${{github.event.inputs.digidoc_ref}}
          path: digidoc
      - name: Build digidoc
        working-directory: digidoc
        run: |
          export VERSION=$(grep project CMakeLists.txt | egrep -o "([0-9]{1,}\.)+[0-9]{1,}")
          export VERSIONEX=${VERSION}+${{matrix.release}}.${{github.run_number}}
          dch --distribution ${{matrix.release}} -v ${VERSIONEX} "Release ${VERSIONEX}."
          dpkg-buildpackage -us -uc
      - name: Run lintian
        run: |
          lintian *.deb
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.release}}_${{matrix.arch}}
          path: "*.deb"
          retention-days: 1
